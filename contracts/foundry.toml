[profile.default]
src = 'src'
test = 'test'
out = 'out'
libs = ['lib']
solc = '0.8.26'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 800
via_ir = false
ffi = true
fs_permissions = [{ access = 'read', path = './' }, { access = 'read', path = '../analysis/out' }, { access = 'read-write', path = './deployments' }]
gas_limit = 3000000000

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 512, depth = 32 }

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32

[rpc_endpoints]
unichain = "${UNICHAIN_RPC_URL}"
unichain_sepolia = "https://sepolia.unichain.org"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
unichain_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 1301 }
